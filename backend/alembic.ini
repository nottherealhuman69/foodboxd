# Alembic settings. Run every alembic command from backend/.
#
# Which database?  (the URL itself is read from backend/.env in migrations/env.py)
#   alembic upgrade head              -> DATABASE_URL       (the real database)
#   alembic -x db=test upgrade head   -> TEST_DATABASE_URL  (the local test database)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# New migration files are named e.g. 0003_add_usernames.py (pass --rev-id 0003)
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
